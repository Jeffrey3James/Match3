name: MacFree Compatibility Tests

on:
  pull_request:
    paths:
      - 'Assets/MacFree/Editor/**'
      - 'tests/macfree/**'
      - '.github/workflows/macfree-tests.yml'
  push:
    branches: [main, fix/macfree-compatible-build-target]
    paths:
      - 'Assets/MacFree/Editor/**'
      - 'tests/macfree/**'
      - '.github/workflows/macfree-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Assets/MacFree/Editor
            tests/macfree
      - name: Install C# test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-mcs libmono-system-net-http4.0-cil
      - name: Compile production client and run regression tests
        run: bash tests/macfree/run-tests.sh
